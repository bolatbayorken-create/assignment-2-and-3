<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookFromHome - Planner</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
      :root {
        --brand-sage: #88a070;
        --brand-sage-dark: #6e8557;
        --cozy-pink-bg: #fde8f0;
        --cozy-pink-border: #f2a8c0;
        --cozy-pink-badge: #f9d2e1;
        --cozy-pink-text: #8a3b5a;
        --bg-light: #f4f7f2;
        --card-bg: #ffffff;
        --text-dark: #333d29;
        --border-color: #e2e8f0;
      }

      .planner-wrapper {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-dark);
        max-width: 1100px;
        margin: 20px auto;
        padding: 10px;
      }

      .planner-header-box {
        text-align: center;
        background: var(--cozy-pink-bg);
        padding: 24px;
        border-radius: 16px;
        border: 2px dashed var(--cozy-pink-border);
        margin-bottom: 24px;
      }

      .planner-header-box h2 {
        color: var(--brand-sage-dark);
        margin: 0 0 8px 0;
        font-size: 28px;
      }

      .planner-header-box p {
        margin: 0;
        color: #666;
        font-size: 15px;
      }

      .planner-grid-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      @media (max-width: 768px) {
        .planner-grid-layout {
          grid-template-columns: 1fr;
        }
      }

      .day-node {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-left: 5px solid var(--brand-sage);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        transition: transform 0.2s ease;
      }

      .day-node:hover {
        transform: translateY(-2px);
      }

      .day-node-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: bold;
        font-size: 18px;
        color: var(--brand-sage-dark);
        border-bottom: 1px dashed var(--border-color);
        padding-bottom: 8px;
        margin-bottom: 12px;
      }

      .badge-kcal {
        font-size: 13px;
        background: var(--cozy-pink-badge);
        color: var(--cozy-pink-text);
        padding: 4px 12px;
        border-radius: 15px;
        font-weight: 600;
      }

      .meal-item-list {
        list-style: none;
        padding-left: 0;
        margin: 0;
      }

      .meal-item-list li {
        padding: 6px 0;
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .meal-item-list li.eaten {
        text-decoration: line-through;
        opacity: 0.5;
      }

      .meal-tag {
        font-weight: 600;
        color: var(--brand-sage-dark);
        min-width: 85px;
      }

      .sidebar-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      }

      .sidebar-card h3 {
        margin-top: 0;
        color: var(--brand-sage-dark);
        font-size: 18px;
        border-bottom: 2px solid var(--bg-light);
        padding-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .progress-text {
        font-size: 12px;
        font-weight: normal;
        color: #888;
      }

      .form-field {
        margin-bottom: 14px;
      }

      .form-field label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 6px;
      }

      .form-field select, 
      .form-field input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        box-sizing: border-box;
        font-family: inherit;
      }

      .btn-action {
        width: 100%;
        background-color: var(--brand-sage);
        color: #ffffff;
        border: none;
        padding: 10px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .btn-action:hover {
        background-color: var(--brand-sage-dark);
      }

      .add-item-box {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

      .add-item-box input {
        flex: 1;
        padding: 8px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
      }

      .btn-add {
        background-color: var(--brand-sage);
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
      }

      .checklist-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid #f8fafc;
      }

      .checklist-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .checklist-row input[type="checkbox"] {
        accent-color: var(--brand-sage);
        width: 16px;
        height: 16px;
        cursor: pointer;
      }

      .checklist-row.completed label {
        text-decoration: line-through;
        color: #94a3b8;
      }

      .btn-delete-item {
        background: none;
        border: none;
        color: #cbd5e1;
        font-size: 16px;
        cursor: pointer;
        padding: 0 4px;
      }

      .btn-delete-item:hover {
        color: #ef4444;
      }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="container header-content">
            <a href="index.html" class="logo"> CookFromHome </a>
            <nav>
                 <a href="index.html">Home</a>
                 <a href="recipes.html">Recipes</a>
                 <a href="planner.html">Planner</a>
                 <a href="tips.html">Tips</a>
                 <a href="pantry.html">Pantry</a>
            </nav>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="planner-wrapper">
      <header class="planner-header-box">
        <h2>Weekly Meal Plan 🥗</h2>
        <p>Customize your diet and manage your shopping list with ease</p>
      </header>

      <div class="planner-grid-layout">
        <section id="daysContainer">
        </section>

        <aside>
          <div class="sidebar-card">
            <h3>⚙️ Plan Settings</h3>
            <div class="form-field">
              <label for="daysSelect">Period:</label>
              <select id="daysSelect">
                <option value="7" selected>7 Days (Full Week)</option>
                <option value="5">5 Days (Weekdays)</option>
                <option value="3">3 Days (Weekend)</option>
              </select>
            </div>

            <div class="form-field">
              <label for="targetCalories">Target (kcal/day):</label>
              <input type="number" id="targetCalories" value="2000" step="50">
            </div>

            <button type="button" class="btn-action" onclick="updatePlan()">Update Plan</button>
          </div>

          <div class="sidebar-card">
            <h3>
              🛒 Grocery List
              <span id="progressTracker" class="progress-text">0/0 completed</span>
            </h3>
            
            <div class="add-item-box">
              <input type="text" id="customInput" placeholder="Add an item...">
              <button type="button" class="btn-add" onclick="addNewProduct()">+ Add</button>
            </div>

            <div id="checklistGroup">
              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item1" onchange="toggleItem(this)">
                  <label for="item1">Cottage cheese (400g)</label>
                </div>
                <button class="btn-delete-item" onclick="deleteItem(this)">×</button>
              </div>

              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item2" onchange="toggleItem(this)">
                  <label for="item2">Chicken breast (1 kg)</label>
                </div>
                <button class="btn-delete-item" onclick="deleteItem(this)">×</button>
              </div>

              <div class="checklist-row">
                <div class="checklist-left">
                  <input type="checkbox" id="item3" onchange="toggleItem(this)">
                  <label for="item3">Fresh greens & avocado</label>
                </div>
                <button class="btn-delete-item" onclick="deleteItem(this)">×</button>
              </div>
            </div>
          </div>
        </aside>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <div class="container footer-content">
            <h2>CookFromHome</h2>
            <p>Cook by yourself :3</p>
        </div>
    </footer>

    <!-- JAVASCRIPT -->
    <script>
      const defaultSchedule = [
        { day: "Monday 🥐", meals: ["Cottage cheese pancakes with berry jam 🥞", "Chicken noodle soup 🍜", "Teriyaki chicken with rice 🥣"] },
        { day: "Tuesday 🍳", meals: ["Avocado toast with poached egg 🥑", "Beef pilaf 🍲", "Baked potatoes with herbs 🥔"] },
        { day: "Wednesday 🥣", meals: ["Oatmeal with banana and honey 🍌", "Homemade pastry & tea 🥐", "Spaghetti Bolognese 🍝"] },
        { day: "Thursday 🧇", meals: ["Scrambled eggs with toast 🍳", "Borscht with sour cream 🍲", "Stuffed bell peppers 🫑"] },
        { day: "Friday 🍕", meals: ["Berry pancakes 🥞", "Chicken and rice bowl 🥣", "Baked salmon with sauce 🐟"] },
        { day: "Saturday ☕", meals: ["Eggs & sausages breakfast 🍳", "Lentil soup with bread 🍞", "Homemade pizza 🍕"] },
        { day: "Sunday 🍰", meals: ["Cottage cheese casserole 🥧", "Fresh vegetable salad & cutlet 🧆", "Buckwheat with meat gravy 🥣"] }
      ];

      function renderDays(daysCount, targetKcal) {
        const container = document.getElementById('daysContainer');
        if (!container) return;
        container.innerHTML = '';

        const baseKcal = parseInt(targetKcal) || 2000;

        for (let i = 0; i < daysCount; i++) {
          const item = defaultSchedule[i];
          const dayKcal = baseKcal + (i % 2 === 0 ? 30 : -20);

          const card = document.createElement('article');
          card.className = 'day-node';
          card.innerHTML = `
            <div class="day-node-header">
              <span>${item.day}</span>
              <span class="badge-kcal">${dayKcal} kcal</span>
            </div>
            <ul class="meal-item-list">
              <li onclick="toggleMeal(this)"><span class="meal-tag">Breakfast:</span> ${item.meals[0]}</li>
              <li onclick="toggleMeal(this)"><span class="meal-tag">Lunch:</span> ${item.meals[1]}</li>
              <li onclick="toggleMeal(this)"><span class="meal-tag">Dinner:</span> ${item.meals[2]}</li>
            </ul>
          `;
          container.appendChild(card);
        }
      }

      function toggleMeal(element) {
        element.classList.toggle('eaten');
      }

      function updatePlan() {
        const daysSelect = document.getElementById('daysSelect');
        const targetCalories = document.getElementById('targetCalories');
        renderDays(parseInt(daysSelect.value), targetCalories.value);
      }

      function toggleItem(checkbox) {
        const row = checkbox.closest('.checklist-row');
        if (checkbox.checked) {
          row.classList.add('completed');
        } else {
          row.classList.remove('completed');
        }
        updateProgress();
      }

      function addNewProduct() {
        const input = document.getElementById('customInput');
        const text = input.value.trim();
        
        if (text !== "") {
          const container = document.getElementById('checklistGroup');
          const newRow = document.createElement('div');
          newRow.className = 'checklist-row';
          
          const newId = 'item_' + Date.now();
          newRow.innerHTML = `
            <div class="checklist-left">
              <input type="checkbox" id="${newId}" onchange="toggleItem(this)">
              <label for="${newId}">${text}</label>
            </div>
            <button class="btn-delete-item" onclick="deleteItem(this)">×</button>
          `;
          
          container.appendChild(newRow);
          input.value = "";
          updateProgress();
        }
      }

      function deleteItem(button) {
        const row = button.closest('.checklist-row');
        row.remove();
        updateProgress();
      }

      function updateProgress() {
        const total = document.querySelectorAll('.checklist-row').length;
        const checked = document.querySelectorAll('.checklist-row input[type="checkbox"]:checked').length;
        const progressEl = document.getElementById('progressTracker');
        if (progressEl) {
          progressEl.textContent = `${checked}/${total} completed`;
        }
      }

      document.addEventListener('DOMContentLoaded', function() {
        renderDays(7, 2000);
        updateProgress();
      });
    </script>
</body>
</html>
