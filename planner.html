<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whimsical Meal Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #faf7f2;
            --card-bg: #ffffff;
            --text-dark: #2d2a26;
            --text-muted: #8c857b;
            --accent-pink: #f4e3e3;
            --accent-pink-dark: #d8a7a7;
            --accent-green: #e2ebd8;
            --accent-green-dark: #8da375;
            --accent-warm: #f7ede2;
            --accent-warm-dark: #d6a15c;
            --border-soft: #f0eae1;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow-soft: 0 10px 30px rgba(163, 145, 133, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* Header & Aesthetic Goal Selector */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--border-soft);
            padding: 12px 20px;
            border-radius: 30px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }

        .mode-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-pink-dark);
        }

        .mode-btn.active {
            background: var(--text-dark);
            color: #fff;
            border-color: var(--text-dark);
            box-shadow: 0 6px 16px rgba(45, 42, 38, 0.15);
        }

        .mode-btn .badge {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(0,0,0,0.05);
        }

        .mode-btn.active .badge {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* Plan Grid */
        .plan-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .day-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px;
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-soft);
            transition: transform 0.3s ease, opacity 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-pink-dark), var(--accent-warm-dark));
            opacity: 0.7;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px dashed var(--border-soft);
        }

        .day-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
        }

        .day-calories {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            background-color: var(--bg-cream);
            color: var(--text-muted);
        }

        .meal-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .meal-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .meal-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .meal-item:nth-child(1) .meal-icon { background: var(--accent-pink); }
        .meal-item:nth-child(2) .meal-icon { background: var(--accent-green); }
        .meal-item:nth-child(3) .meal-icon { background: var(--accent-warm); }

        .meal-details {
            display: flex;
            flex-direction: column;
        }

        .meal-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .meal-title {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-dark);
            margin-top: 1px;
        }

        .meal-kcal {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Subtle Fade Animation */
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Weekly Culinary Mood ✨</h1>
        <p>Выберите настроение рациона — всё пересчитается гармонично и красиво</p>
        
        <div class="mode-selector">
            <button class="mode-btn active" onclick="setMode('light', this)">
                <span>🌸 Soft & Light</span>
                <span class="badge">~1450 kcal</span>
            </button>
            <button class="mode-btn" onclick="setMode('balanced', this)">
                <span>🌿 Daily Balance</span>
                <span class="badge">~1850 kcal</span>
            </button>
            <button class="mode-btn" onclick="setMode('energy', this)">
                <span>⚡ Energy Boost</span>
                <span class="badge">~2250 kcal</span>
            </button>
        </div>
    </div>

    <div class="plan-grid fade-in" id="planGrid">
        <!-- Карточки сгенерируются скриптом -->
    </div>
</div>

<script>

                    { type: "Обед", name: "Зеленый салат с киноа и авокадо", kcal: 510, icon: "🥗" },
                    { type: "Ужин", name: "Филе трески на пару с брокколи", kcal: 400, icon: "🐟" },
                    { type: "Перекус", name: "Греческий йогурт и горсть голубики", kcal: 190, icon: "🫐" }
                ]
            },
            {
                day: "Вторник",

                    { type: "Завтрак", name: "Смузи-боул с бананом и шпинатом", kcal: 310, icon: "🥤" },

                    { type: "Перекус", name: "Горсть миндаля", kcal: 180, icon: "🥜" }
                ]
            }
        ],
        balanced: [
            {
                day: "Понедельник",
                totalKcal: 1840,
                meals: [
                    { type: "Завтрак", name: "Овсянка на кокосовом молоке с бананом", kcal: 420, icon: "🥣" },
                    { type: "Обед", name: "Паста с куриной грудкой и соусом песто", kcal: 650, icon: "🍝" },
                    { type: "Ужин", name: "Запеченный лосось с спаржей", kcal: 530, icon: "🐟" },
                    { type: "Перекус", name: "Хлебец с авокадо и яйцом пашот", kcal: 240, icon: "🥑" }
                ]
            },
            {
                day: "Вторник",
                totalKcal: 1890,
                meals: [
                    { type: "Завтрак", name: "Сырники с нежной сметаной и ягодами", kcal: 480, icon: "🥞" },
                    { type: "Обед", name: "Стейк из индейки с молодым картофелем", kcal: 620, icon: "🥩" },
                    { type: "Ужин", name: "Теплый салат с тунцом и фасолью", kcal: 510, icon: "🥗" },
                    { type: "Перекус", name: "Горсть кешью и сухофруктов", kcal: 280, icon: "🌰" }
                ]
            },
            {
                day: "Среда",
                totalKcal: 1820,
                meals: [
                    { type: "Завтрак", name: "Омлет из 3 яиц со шпинатом и томатами", kcal: 410, icon: "🍳" },
                    { type: "Обед", name: "Азиатский боул с говядиной и соусом терияки", kcal: 680, icon: "🍚" },
                    { type: "Ужин", name: "Запеченная куриная грудка с бататом", kcal: 490, icon: "🍗" },

                ]
            }
        ],
        energy: [
            {
                day: "Понедельник",
                totalKcal: 2260,
                meals: [
                    { type: "Завтрак", name: "Английский завтрак (яйца, бекон, тост)", kcal: 580, icon: "🍳" },
                    { type: "Обед", name: "Сытный плов с нежной говядиной", kcal: 780, icon: "🍲" },
                    { type: "Ужин", name: "Паста Болоньезе с пармезаном", kcal: 620, icon: "🍝" },

                ]
            },
            {
                day: "Вторник",
                totalKcal: 2240,
                meals: [
                    { type: "Завтрак", name: "Панкейки с бананом, орехами и кленовым сиропом", kcal: 610, icon: "🥞" },
                    { type: "Обед", name: "Стейк рибай с овощами гриль", kcal: 820, icon: "🥩" },
                    { type: "Ужин", name: "Запеченный лосось с киноа и авокадо", kcal: 550, icon: "🐟" },
                    { type: "Перекус", name: "Тост с рикоттой, инжиром и медом", kcal: 260, icon: "🍞" }
                ]
            },
            {
                day: "Среда",
                totalKcal: 2280,
                meals: [
                    { type: "Завтрак", name: "Сэндвич с лососем, сливочным сыром и яйцом", kcal: 540, icon: "🥪" },
                    { type: "Обед", name: "Куриное карри с рисом басмати", kcal: 760, icon: "🍛" },
                    { type: "Ужин", name: "Запеченная утиная грудка с яблоками", kcal: 670, icon: "🦆" },
                    { type: "Перекус", name: "Горсть миндаля и темный шоколад", kcal: 310, icon: "🍫" }
                ]
            }
        ]
    };

    function renderMenu(modeKey) {
        const grid = document.getElementById('planGrid');
        grid.classList.remove('fade-in');
        
        // Маленький трюк для перезапуска анимации
        void grid.offsetWidth; 
        
        const currentData = menus[modeKey];
        grid.innerHTML = currentData.map(dayData => `
            <div class="day-card">
                <div class="day-header">
                    <span class="day-name">${dayData.day}</span>
                    <span class="day-calories">${dayData.totalKcal} kcal</span>
                </div>
                <div class="meal-list">
                    ${dayData.meals.map(meal => `
                        <div class="meal-item">
                            <div class="meal-icon">${meal.icon}</div>
                            <div class="meal-details">
                                <span class="meal-type">${meal.type}</span>
                                <span class="meal-title">${meal.name}</span>
                                <span class="meal-kcal">${meal.kcal} kcal</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');

        grid.classList.add('fade-in');
    }

    function setMode(modeKey, btn) {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderMenu(modeKey);
    }

    // Инициализация при старте
    renderMenu('light');
</script>

</body>
</html>
